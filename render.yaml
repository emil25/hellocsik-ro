# The web service uses an external PostgreSQL database (Neon Free).
# Keep credentials in Render; never put connection strings in this file.
services:
  - type: web
    name: hellocsik-ro
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile && pnpm build:app
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
